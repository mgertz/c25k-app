org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Low-RAM machine: don't keep build daemons alive for hours.
# Pick ONE of the two Gradle Daemon options below, not both.

# Option A (active): Gradle Daemon shuts down after 3 minutes of idle time
# instead of the default 3 hours. Keeps builds fast when run back-to-back,
# while still freeing RAM shortly after.
org.gradle.daemon.idletimeout=180000

# Option B (alternative): disable the Gradle Daemon entirely. No daemon ever
# lingers in the background, but every build pays full JVM startup cost and
# loses the cross-build cache, so builds are consistently slower.
#org.gradle.daemon=false

# Kotlin compiler runs as a one-off process per build instead of a persistent
# Kotlin Daemon, so it doesn't linger in the background eating RAM.
kotlin.compiler.execution.strategy=out-of-process
